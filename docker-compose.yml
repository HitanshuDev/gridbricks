services:
  backend:
    build:
      context: ./backend
    environment:
      DATA_MODE: ${DATA_MODE:-elexon}
      DATA_DIR: /var/lib/windscope
      CSV_DIR: /var/lib/windscope/imports
      API_TIMEOUT_SECONDS: ${API_TIMEOUT_SECONDS:-30}
      API_MAX_RETRIES: ${API_MAX_RETRIES:-4}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
    volumes:
      - windscope-data:/var/lib/windscope
      - ./backend/data/imports:/var/lib/windscope/imports:ro
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
        VITE_DEFAULT_SOURCE: ${DATA_MODE:-elexon}
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  windscope-data:
